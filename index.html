<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLACK MARKET</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="green-line"></div>

  <div id="loader">
    <div class="loader-title">BLACK MARKET</div>
    <div class="loader-subtitle">ЗАКРЫТЫЙ РЫНОК · ТЕРМИНАЛ</div>
    <div class="spinner"></div>
    <div id="ld-line" style="margin-top:16px;font-size:12px;letter-spacing:.2em;color:var(--mut)">СОЕДИНЕНИЕ...</div>
    <button id="enter" class="btn pri" style="margin-top:24px;display:none">ВОЙТИ НА РЫНОК</button>
    <div class="loader-bottom">BLACK MARKET В СЕТИ</div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="h-left">
        <span style="font-size:10px;color:var(--mut)">БАЛАНС</span>
        <b id="bal" style="font-size:18px;color:var(--grn)">₽ 0</b>
      </div>
      <div class="h-right">
        <button id="bell" style="position:relative;background:none;border:none;color:var(--tx);font-size:20px;cursor:pointer">
          🔔<span id="badge" class="badge" hidden>0</span>
        </button>
      </div>
    </header>
    <div id="raid" class="raid-bar" hidden>
      <div id="rd-i" class="raid-fill"></div>
      <span id="rd-t" class="raid-text">ТОРГИ ПРИОСТАНОВЛЕНЫ</span>
    </div>
    <main id="view"></main>
    <nav class="tabs">
      <button class="tab on" data-page="market">РЫНОК</button>
      <button class="tab" data-page="auctions">АУКЦИОНЫ</button>
      <button class="tab" data-page="contracts">КОНТРАКТЫ</button>
      <button class="tab" data-page="inventory">ИНВЕНТ.</button>
      <button class="tab" data-page="craft">КРАФТ</button>
      <button class="tab" data-page="profile">ПРОФИЛЬ</button>
    </nav>
  </div>

  <div id="toasts"></div>
  <div id="modals"></div>

  <script>
    (function(){
      var L = document.getElementById('ld-line');
      var btn = document.getElementById('enter');
      var loader = document.getElementById('loader');
      var app = document.getElementById('app');
      var gl = document.querySelector('.green-line');
      var lines = ['СОЕДИНЕНИЕ...', 'ШИФРОВАНИЕ СЕССИИ...', 'УСТАНОВКА ЗАЩИЩЁННОГО КАНАЛА...'];
      var i = 0;
      function nx(){
        if(i < lines.length){
          if(L) L.textContent = lines[i++];
          setTimeout(nx, 700);
        } else {
          if(L) L.textContent = 'КАНАЛ ГОТОВ';
          if(btn) btn.style.display = 'inline-block';
        }
      }
      setTimeout(nx, 500);
      setTimeout(function(){
        if(btn && btn.style.display !== 'inline-block') btn.style.display = 'inline-block';
      }, 3500);
      btn.addEventListener('click', function(){
        if(loader) loader.style.opacity = '0';
        setTimeout(function(){
          if(loader) loader.remove();
          if(gl) gl.remove();
          if(app) app.classList.remove('hidden');
          if(window.enterGame) window.enterGame();
        }, 600);
      });
    })();
  </script>

  <script src="js/app.js"></script>
</body>
</html>
