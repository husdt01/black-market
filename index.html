<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLACK MARKET</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="green-line"></div>

  <div id="loader">
    <div class="loader-title">BLACK MARKET</div>
    <div class="loader-subtitle">ЗАКРЫТЫЙ РЫНОК · ТЕРМИНАЛ</div>
    <div class="spinner"></div>
    <div id="ld-line">СОЕДИНЕНИЕ...</div>
    <button id="enter">ВОЙТИ В РЫНОК</button>
    <div class="loader-bottom">BLACK MARKET В СЕТИ</div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="brand">BLACK MARKET<span class="dot"></span><span class="online">В СЕТИ</span></div>
      <div class="h-bal"><span>БАЛАНС</span><b id="bal">₽ 0</b></div>
      <button id="bell">🔔<span id="badge" class="badge" hidden>0</span></button>
    </header>

    <div id="raid" class="raid-bar" hidden>
      <div id="rd-i" class="raid-fill"></div>
      <span id="rd-t" class="raid-text">⚠ РЕЙД · РЫНОК ЗАМОРОЖЕН</span>
    </div>

    <main id="view"></main>

    <nav class="tabs">
      <button class="tab on" data-page="market">РЫНОК</button>
      <button class="tab" data-page="auctions">АУКЦИОН</button>
      <button class="tab" data-page="contracts">ЗАДАНИЯ</button>
      <button class="tab" data-page="inventory">ИНВЕНТ.</button>
      <button class="tab" data-page="craft">КРАФТ</button>
      <button class="tab" data-page="profile">ПРОФИЛЬ</button>
    </nav>
  </div>

  <div id="toasts"></div>
  <div id="modals"></div>

  <script>
    (function(){
      var L=document.getElementById('ld-line'),btn=document.getElementById('enter'),
          loader=document.getElementById('loader'),app=document.getElementById('app'),
          gl=document.querySelector('.green-line'),
          lines=['СОЕДИНЕНИЕ...','ШИФРОВАНИЕ СЕССИИ...','УСТАНОВКА ЗАЩИЩЁННОГО КАНАЛА...'],i=0;
      function nx(){
        if(i<lines.length){if(L)L.textContent=lines[i++];setTimeout(nx,700)}
        else{if(L)L.textContent='КАНАЛ ГОТОВ';if(btn)btn.style.display='inline-block'}
      }
      setTimeout(nx,500);
      setTimeout(function(){if(btn&&btn.style.display!=='inline-block')btn.style.display='inline-block'},3500);
      btn.addEventListener('click',function(){
        if(loader)loader.style.opacity='0';
        setTimeout(function(){
          if(loader)loader.remove();
          if(gl)gl.remove();
          if(app)app.classList.remove('hidden');
          if(window.enterGame)window.enterGame();
        },600);
      });
    })();
  </script>
  <script src="js/sound.js"></script>
<script src="js/app.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
